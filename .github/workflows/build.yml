name: Build

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod Jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: chmod gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show produced jars
        if: always()
        run: ls -l build/libs || true

      - name: Verify jar contents
        run: |
          JAR=$(ls build/libs/astranautics-*-mc*.jar | grep -v sources | head -n 1)
          echo "Checking $JAR"
          unzip -l "$JAR" | tee /dev/stderr | grep -q "com/astranautics/AstraNautics.class"
          unzip -l "$JAR" | grep -q "META-INF/mods.toml"
          unzip -l "$JAR" | grep -q "pack.mcmeta"
          echo "OK: 読み込み用 jar の中身を確認しました"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: astranautics-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
