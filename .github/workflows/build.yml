name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Validate resources (JSON / TOML)
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for path in pathlib.Path('src/main/resources').rglob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          for path in pathlib.Path('src/main/resources').rglob('*.mcmeta'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('resource JSON valid')
          PY

      - name: Build (ForgeGradle)
        id: gradle
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          msg=$(grep -B 2 -A 12 -m 4 -E "FAILED|error:|What went wrong|AssertionFailedError" build.log \
                | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
