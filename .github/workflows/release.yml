name: Build and Release

# Creates a GitHub Release with the Forge 1.20.1 mod jar attached.
#
# The jar is built on GitHub's runners (which can reach maven.minecraftforge.net),
# so the release asset is produced by a regular ForgeGradle build.
# If ForgeGradle cannot reach its repositories, the offline builder
# `tools/build_jar.py` is used as a fallback so a load-only jar is still attached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (a tag named like v1.0.0 is created if it does not exist)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ForgeGradle 6 needs Gradle 8.x, so pin the version instead of relying
      # on whatever Gradle happens to be preinstalled on the runner.
      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build with ForgeGradle
        id: forgegradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee forgegradle-build.log

      - name: Report ForgeGradle failure
        if: steps.forgegradle.outcome == 'failure'
        run: |
          msg=$(grep -A 8 -m 2 -E "What went wrong|Could not|FAILURE:" forgegradle-build.log \
                | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=ForgeGradle build failed::${msg}"

      - name: Fallback build (offline jar builder)
        if: ${{ hashFiles('build/libs/*.jar') == '' }}
        run: |
          echo "ForgeGradle build did not produce a jar, using tools/build_jar.py" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/build_jar.py --check

      - name: Build log
        if: always()
        run: |
          {
            echo '### ForgeGradle build log (tail)'
            echo '```'
            tail -n 80 forgegradle-build.log 2>/dev/null || echo 'no log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show artifacts
        run: ls -l build/libs/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: AstraNautics ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} (Minecraft 1.20.1 / Forge)
          body: |
            Minecraft **1.20.1 / Forge 47.x** 用の load-only MOD です（読み込み確認用）。

            - Mod ID: `astranautics`
            - 対応: Minecraft `1.20.1` / Forge `47.x` / Java 17

            ## 使い方
            1. Forge 1.20.1 (47.2.0) をインストールしたプロファイルを用意する
            2. 添付の jar を `.minecraft/mods/` にコピーする
            3. 起動してログに `AstraNautics loaded (Minecraft 1.20.1 / Forge)` が出れば読み込み成功
          files: build/libs/*.jar
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
