name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン（build/libs にある jar に合わせる想定）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: chmod gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Determine version and jar
        id: meta
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$GITHUB_REF_NAME" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$MOD_VERSION"
          fi
          JAR=$(ls build/libs/astranautics-*-mc*.jar | grep -v sources | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION / Jar: $JAR"

      - name: Verify jar contents
        run: |
          unzip -l "${{ steps.meta.outputs.jar }}" | grep -q "com/astranautics/AstraNautics.class"
          unzip -l "${{ steps.meta.outputs.jar }}" | grep -q "META-INF/mods.toml"
          unzip -l "${{ steps.meta.outputs.jar }}" | grep -q "pack.mcmeta"
          echo "OK: 読み込み用 jar を確認しました"

      - name: Create GitHub Release with jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES=$(cat <<'EOF'
          ## AstraNautics

          Minecraft **Forge 1.20.1** 用 MOD（読み込み確認用ビルド）

          ### 導入方法
          1. 下の Assets から `astranautics-*.jar` をダウンロード
          2. `mods` フォルダに配置
          3. Forge 1.20.1 (47.x) で起動
          4. ログに `AstraNautics ... Ready for launch!` が出れば読み込み成功
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "既存リリース $TAG に jar を追加します"
            gh release upload "$TAG" "${{ steps.meta.outputs.jar }}" --clobber
          else
            gh release create "$TAG" "${{ steps.meta.outputs.jar }}" \
              --target main \
              --title "AstraNautics v${VERSION}" \
              --notes "$NOTES"
          fi
